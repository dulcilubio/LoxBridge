<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — LoxBridge</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 24px 80px;
      color: #1a1a1a;
      line-height: 1.7;
      font-size: 16px;
    }
    h1 { font-size: 1.8em; border-bottom: 2px solid #e0e0e0; padding-bottom: 12px; }
    h2 { font-size: 1.2em; margin-top: 2em; }
    h3 { font-size: 1em; margin-top: 1.5em; color: #333; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 0.95em;
    }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f5f5f5; }
    hr { border: none; border-top: 1px solid #e0e0e0; margin: 2em 0; }
    a { color: #0070f3; }
    strong { font-weight: 600; }
    #loading { color: #666; }
    #error { color: #c00; }
  </style>
</head>
<body>
  <p id="loading">Loading…</p>
  <div id="content"></div>
  <script>
    fetch('https://raw.githubusercontent.com/dulcilubio/LoxBridge/main/PRIVACY_POLICY.md')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(md) {
        document.getElementById('loading').remove();
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(function(err) {
        var el = document.getElementById('loading');
        el.id = 'error';
        el.textContent = 'Could not load privacy policy. Please try again later.';
      });
  </script>
</body>
</html>
